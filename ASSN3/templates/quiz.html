<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz</title>
</head>
<body>
  <h1>Question {{ question_number + 1 }}: {{ question }}</h1>

  {% if answer_feedback %}
  <p role="status">{{ answer_feedback }}</p>
  <form method="POST">
    <button type="submit" name="action" value="next">Next</button>
  </form>
  {% else %}
  <form method="POST">
    {% for option in options %}
    <label>
      <input type="radio" name="answer" value="{{ option }}" required>
      {{ option }}
    </label><br>
    {% endfor %}

    <details>
      <summary>Jigglypuff, use helping hand!</summary>
      <p>Jigglypuff: {{ hint }}</p>
    </details>

    <button type="submit">Submit Answer</button>
  </form>
  {% endif %}
</body>
</html>
