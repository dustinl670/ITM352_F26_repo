<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz | Professor Dust's Trainer Assessment </title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="page">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span> Professor Dust's Trainer Assessment </div>
        <section class="card">
            <p class="eyebrow">Question #{{ question_number + 1 }}</p>
            <h1>{{ question }}</h1>

            {% if answer_feedback %}
                <p class="feedback" role="status">{{ answer_feedback }}</p>
                <form method="POST">
                    <button class="button" type="submit" name="action" value="next">Next </button>
                </form>
            {% else %}
                <form method="POST">
                    <fieldset class="answers">
                        <legend>Choose your answer</legend>
                        {% for option in options %}
                            <label class="answer">
                                <input type="radio" name="answer" value="{{ option }}" required>
                                <span>{{ option }}</span>
                            </label>
                        {% endfor %}
                    </fieldset>

                    <details class="hint">
                        <summary>
                          <span class="hint-icon" aria-hidden="true"></span>
                          Jigglypuff, use Helping Hand!
                        </summary>
                        <p>Jigglypuff: {{ hint }}</p>
                    </details>

                    <button class="button" type="submit">Submit </button>
                </form>
            {% endif %}
        </section>
    </main>
</body>
</html>
