<!DOCTYPE html> 
<html lang="en">
<head>
    <!-- Set the page's character encoding and make it scale correctly on mobile devices. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Result</title>
</head>
<body>
    <!-- Displays quiz score/total questions -->
    <h1>Quiz Result</h1> 
    <p>Your score: {{ score }} out of {{ max_questions }}</p>
    <p>High score: {{ high_score }} out of {{ max_questions }}</p>
    <!-- Returns to index to restart the quiz.. -->
    <a href="{{ url_for('index') }}">Take Quiz Again</a>
</body>
</html>
